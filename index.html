
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سنجش عملکردی دانشجویان</title>
<style>
body{font-family:tahoma;background:#eef2f7;margin:0;color:#183047}
header{background:#164e63;color:white;text-align:center;padding:30px}
main{max-width:700px;margin:30px auto;padding:15px}
.card{background:white;padding:25px;border-radius:14px;margin:15px 0}
input{width:90%;padding:13px;margin:10px 0;border:1px solid #ccc;border-radius:8px}
button{background:#087e8b;color:white;border:0;padding:12px 25px;border-radius:8px}
</style>
</head>
<body>
<header>
<h1>سامانه سنجش عملکردی دانشجویان</h1>
<p>ارزیابی، یادگیری و پیشرفت تحصیلی</p>
</header>
<main>
<div class="card">
<h2>ورود دانشجو</h2>
<input placeholder="کد دانشجویی">
<input type="password" placeholder="رمز عبور">
<button onclick="alert('ورود واقعی هنوز فعال نشده است')">ورود</button>
</div>
<div class="card">
<h2>امکانات سامانه</h2>
<p>مشاهده تکالیف و تمرین‌ها</p>
<p>ثبت پاسخ دانشجو</p>
<p>مشاهده نمرات و بازخورد مدرس</p>
<p>پیگیری پیشرفت تحصیلی</p>
</div>
</main>
</body>
</html>
